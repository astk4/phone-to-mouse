name: WPF app and C++ DLL Build

on:
  push:
    branches:
      - 'dev-desktop'

defaults:
  run:
    working-directory: ./WindowsSide

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '6.0'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build C++ DLL
      run: |
        msbuild MouseSimulationLib/MouseSimulationLib.vcxproj /p:Configuration=Release /p:Platform=x64

    - name: Upload C++ DLL Artifact
      uses: actions/upload-artifact@v7
      with:
        name: cpp-library
        path: |
          **/MouseSimulationLib/x64/Release/MouseSimulationLib.dll
        if-no-files-found: error

    - name: Copy DLL to WPF Project
      shell: powershell
      run: Copy-Item -Path "MouseSimulationLib/x64/Release/MouseSimulationLib.dll" -Destination "DesktopClient/"

    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./WindowsSide/DesktopClient

    - name: Build Application
      run: dotnet build --configuration Release --no-restore
      working-directory: ./WindowsSide/DesktopClient

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: wpf-app-release
        path: |
          **/bin/Release/net6.0-windows/
        if-no-files-found: error